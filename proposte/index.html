<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Proposte — C.PINSAI</title>
    <meta
      name="description"
      content="Le infrastrutture di C.PINSAI per settori specifici: segreteria, ristorazione e palestre."
    />
    <meta name="theme-color" content="#F5EFE2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" hreflang="it" href="https://cpinsai.it/proposte/" />
    <link rel="alternate" hreflang="en" href="https://cpinsai.it/en/proposte/" />
    <link rel="alternate" hreflang="x-default" href="https://cpinsai.it/proposte/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="C.PINSAI" />
    <meta property="og:title" content="Proposte — C.PINSAI" />
    <meta
      property="og:description"
      content="Non un gestionale in più: un'infrastruttura operativa costruita attorno al tuo settore."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Contact form registered with Netlify Forms (detected at deploy time). The visible form is
      rendered by React and posts the same fields; see src/utils/sendContact.js.
    -->
    <form name="contatti" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="language" />
      <input type="text" name="bot-field" />
    </form>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#4B2D20;background:#F5EFE2">
        C.PINSAI — Soluzioni per ottimizzare il lavoro di tutti i giorni.
        Per un'esperienza completa abilita JavaScript, oppure scrivici su WhatsApp al +39 339 427 7111.
      </p>
    </noscript>
    <script type="module" src="/src/pages/proposte.jsx"></script>
  </body>
</html>
