<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>C.PINSAI — Come bere un caffè, ma te lo prepariamo noi</title>
    <meta
      name="description"
      content="C.PINSAI progetta soluzioni di Intelligenza Artificiale e automazione che ti aiutano nel lavoro di tutti i giorni. Fai il Coffee Check e scopri dove recuperare tempo."
    />
    <meta name="theme-color" content="#F5EFE2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate" hreflang="it" href="https://cpinsai.it/" />
    <link rel="alternate" hreflang="en" href="https://cpinsai.it/en/" />
    <link rel="alternate" hreflang="x-default" href="https://cpinsai.it/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="C.PINSAI" />
    <meta property="og:title" content="C.PINSAI — Come bere un caffè, ma te lo prepariamo noi" />
    <meta
      property="og:description"
      content="Soluzioni per ottimizzare il lavoro di tutti i giorni."
    />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "C.PINSAI",
        "description": "Soluzioni per ottimizzare il lavoro di tutti i giorni.",
        "telephone": "+39 339 427 7111"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Contact form registered with Netlify Forms (detected at deploy time). The visible form is
      rendered by React and posts the same fields; see src/utils/sendContact.js.
    -->
    <form name="contatti" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="language" />
      <input type="text" name="bot-field" />
    </form>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#4B2D20;background:#F5EFE2">
        C.PINSAI — Soluzioni per ottimizzare il lavoro di tutti i giorni.
        Per un'esperienza completa abilita JavaScript, oppure scrivici su WhatsApp al +39 339 427 7111.
      </p>
    </noscript>
    <script type="module" src="/src/pages/home.jsx"></script>
  </body>
</html>
